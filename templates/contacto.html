<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Eventos Especiales VG</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    {% include 'navbar.html' %}

    <section class="section contacto">
        <h2>Contáctanos</h2>

        <form class="contact-form" action="{{ url_for('contacto') }}" method="POST">

            <input
                type="text"
                name="nombre"
                placeholder="Tu nombre"
                required
            >

            <input
                type="email"
                name="correo"
                placeholder="Tu correo electrónico"
                required
            >

            <textarea
                name="mensaje"
                placeholder="Escribe tu mensaje aquí..."
                rows="6"
                required
            ></textarea>

            <button type="submit" class="btn-gold">
                Enviar mensaje
            </button>

        </form>

        {% if enviado %}
        <div class="mensaje-exito">
            ¡Gracias por contactarnos! Hemos recibido tu mensaje y nos comunicaremos contigo lo antes posible.
        </div>
        {% endif %}

        <div class="social-links">

            <a href="https://www.facebook.com/share/1aNftFWPjV/?mibextid=wwXIfr"
               target="_blank"
               class="social-icon"
               aria-label="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>

            <a href="https://www.instagram.com/eventos_especiales_vg?igsh=MTQ4aWVnbTNsdHczZQ=="
               target="_blank"
               class="social-icon"
               aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>

            <a href="https://wa.me/50663524165"
               target="_blank"
               class="social-icon"
               aria-label="WhatsApp">
                <i class="fab fa-whatsapp"></i>
            </a>

        </div>

    </section>

    <footer>
        <p class="footer-copy">&copy; 2026 Eventos Especiales VG</p>
    </footer>

</body>
</html>
